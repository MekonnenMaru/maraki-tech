<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maraki Admin</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/css/admin.css" />
  <script>
    // Apply the saved light/dark theme before the page paints (no flash).
    (function () {
      try {
        var saved = localStorage.getItem("maraki-theme");
        document.documentElement.dataset.theme =
          saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- Shown for a moment while we check if you're signed in -->
  <div class="boot" id="boot"><span class="spinner"></span></div>

  <!-- ===================== Sign in ===================== -->
  <main class="login" id="loginView" hidden>
    <form class="login-card" data-form="login" id="loginForm">
      <div class="brand">
        <span class="logo-mark" aria-hidden="true"><span class="ring"></span><span class="dot"></span></span>
        <span>MARAKI <small>Admin</small></span>
      </div>
      <h1>Welcome back</h1>
      <p class="muted">Sign in to edit the website and read new leads.</p>
      <div class="field"><label for="login-user">Username</label><input id="login-user" name="username" autocomplete="username" required /></div>
      <div class="field"><label for="login-pass">Password</label><input id="login-pass" name="password" type="password" autocomplete="current-password" required /></div>
      <p class="form-error" id="loginError" role="alert"></p>
      <button class="btn primary block" type="submit">Sign in</button>
    </form>
  </main>

  <!-- ===================== Dashboard ===================== -->
  <div class="app" id="appView" hidden>
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard" data-action="go" data-page="dashboard">
        <span class="logo-mark" aria-hidden="true"><span class="ring"></span><span class="dot"></span></span>
        <span>MARAKI <small>Admin</small></span>
      </a>
      <nav class="menu" id="menu" aria-label="Admin pages"></nav>
      <div class="sidebar-foot">
        <span class="avatar small" id="whoInitial">A</span>
        <span class="who" id="who"></span>
        <button class="icon-btn" type="button" id="logoutButton" data-action="logout" title="Log out" aria-label="Log out"></button>
      </div>
    </aside>
    <div class="backdrop" data-action="close-sidebar"></div>

    <div class="workspace">
      <header class="topbar">
        <button class="icon-btn menu-button" id="menuButton" type="button" data-action="open-sidebar" aria-label="Open menu"></button>
        <h1 id="pageTitle">Overview</h1>
        <span class="spacer"></span>
        <button class="icon-btn" id="themeToggle" type="button" data-action="toggle-theme" aria-label="Switch theme"></button>
        <a class="btn ghost small" id="viewSite" href="/" target="_blank" rel="noopener"><span class="hide-sm">View site</span></a>
      </header>

      <div class="banner" id="passwordBanner" hidden>
        <span>You're still using the default password. Change it before the site goes live.</span>
        <button class="btn small" type="button" data-action="go" data-page="account">Change password</button>
      </div>

      <main class="view" id="view"></main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div class="toasts" id="toastRoot" aria-live="polite"></div>

  <script type="module" src="/admin/js/main.js"></script>
</body>
</html>
